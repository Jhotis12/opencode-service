services:
  platform:
    build: .
    image: agentic-platform:local
    ports:
      - "${HOST_PORT:-3001}:3000"
    volumes:
      - platform-data:/data
    depends_on:
      transcription:
        condition: service_healthy
    environment:
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123!}
      AGENT_CHAT_TIMEOUT_MS: ${AGENT_CHAT_TIMEOUT_MS:-900000}
      AGENT_TURN_MAX_MS: ${AGENT_TURN_MAX_MS:-1800000}
      AGENT_TURN_IDLE_MS: ${AGENT_TURN_IDLE_MS:-600000}
      AGENT_TURN_POLL_MS: ${AGENT_TURN_POLL_MS:-750}
      AGENT_TURN_RETRY_MS: ${AGENT_TURN_RETRY_MS:-2000}
      CHAT_TURN_ENGINE: ${CHAT_TURN_ENGINE:-v2}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      OPENCODE_MODE: ${OPENCODE_MODE:-auto}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      OPENCODE_SERVICE_FILE: ${OPENCODE_SERVICE_FILE:-}
      OPENCODE_PROVIDER_TIMEOUT_MS: ${OPENCODE_PROVIDER_TIMEOUT_MS:-1800000}
      OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: ${OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS:-1800000}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-opencode/deepseek-v4.1-flash-free}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-}
      OPENCODE_DB: ${OPENCODE_DB:-}
      XDG_STATE_HOME: ${XDG_STATE_HOME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:-}
      PLATFORM_GLOBAL_TOKEN: ${PLATFORM_GLOBAL_TOKEN:-}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
    restart: unless-stopped

  transcription:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    expose:
      - "8000"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  transcription-init:
    image: curlimages/curl:8.10.1
    depends_on:
      transcription:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        curl -fsS -X POST http://transcription:8000/v1/models/Systran/faster-whisper-base &&
        curl -fsS -X POST http://transcription:8000/v1/models/Systran/faster-whisper-small &&
        curl -fsS -X POST http://transcription:8000/v1/models/speaches-ai/Kokoro-82M-v1.0-ONNX
    restart: "no"

volumes:
  platform-data:
  whisper-models:
