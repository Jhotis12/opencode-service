schema: review-gated-delivery

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - 'Start only when `git status --short` has no unrelated changes; stop and ask the user to commit or stash them.'
      - 'Work on `change/<change-name>` created from the remote base branch, and commit the planning artifacts first with `docs(openspec): plan <change-name>`.'
      - 'Create one atomic commit per numbered task group with `<type>(<change-name>): <summary>`; verify `git status --short` is clean before starting the next group.'
      - 'At the end, push the branch and open a PR with `gh pr create`; report the URL and never merge.'
      - 'If `gh` is missing, unauthenticated, or the push/PR fails, stop with manual instructions and do not report completion.'
  archive:
    guidance:
      - 'Before archiving, run `gh pr view change/<change-name> --json state,mergedAt` and require `mergedAt` to be non-null; stop if the PR is open or unmerged.'
      - 'If the change has no PR (explicit opt-out) or the remote is not GitHub, require explicit human confirmation that the work was reviewed and merged.'
      - 'Never archive while the PR is still open or the review is pending.'
